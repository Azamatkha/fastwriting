<style>
:root{
  --bg:#eaf4f5; --panel:#ffffff; --panel2:#f2f8f9; --ink:#10265a; --dim:#7d90ad;
  --turq:#0a8c8a; --gold:#e3a41f; --onGold:#10265a; --bad:#c8402f; --badbg:#fbdcd6; --line:#cfe0e4;
  --glow1:rgba(10,140,138,.18); --glow2:rgba(227,164,31,.16);
  --shadow:0 18px 40px -24px rgba(16,38,90,.4);
  --tile:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%230a8c8a' stroke-opacity='.12' stroke-width='1.3'><path d='M36 8l8 20 20 8-20 8-8 20-8-20-20-8 20-8z'/></g><g fill='%23e3a41f' fill-opacity='.2'><circle cx='0' cy='0' r='2'/><circle cx='72' cy='0' r='2'/><circle cx='0' cy='72' r='2'/><circle cx='72' cy='72' r='2'/></g></svg>");
  --head:"Bricolage Grotesque",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;
}
:root[data-theme="dark"]{
  --bg:#060f24; --panel:#0d1b3d; --panel2:#112350; --ink:#eaf0ff; --dim:#7b8fba;
  --turq:#38d9cf; --gold:#f6c64f; --onGold:#0a1633; --bad:#ff8f7e; --badbg:#4a2536; --line:#1d3466;
  --glow1:rgba(56,217,207,.16); --glow2:rgba(246,198,79,.10);
  --shadow:0 26px 60px -26px rgba(0,0,0,.85);
  --tile:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%2338d9cf' stroke-opacity='.09' stroke-width='1.3'><path d='M36 8l8 20 20 8-20 8-8 20-8-20-20-8 20-8z'/></g><g fill='%23f6c64f' fill-opacity='.16'><circle cx='0' cy='0' r='2'/><circle cx='72' cy='0' r='2'/><circle cx='0' cy='72' r='2'/><circle cx='72' cy='72' r='2'/></g></svg>");
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:var(--mono);min-height:100vh;
  background:radial-gradient(900px 520px at 8% -8%,var(--glow1),transparent 62%),
    radial-gradient(820px 520px at 100% 108%,var(--glow2),transparent 62%),var(--tile),var(--bg);
  transition:background-color .3s,color .3s}
.s1{fill:var(--turq)}.s2{fill:var(--gold)}.s3{fill:var(--panel)}.s4{fill:var(--bad)}
.band{height:34px;color:var(--turq);border-bottom:1.5px solid var(--line);overflow:hidden;background:var(--panel)}
.band svg{display:block;width:100%;height:100%}
main{max-width:940px;margin:0 auto;padding:clamp(22px,5vw,52px) 16px 56px}

.top{display:flex;justify-content:space-between;align-items:center;gap:1.2rem;flex-wrap:wrap;margin-bottom:2.4rem}
.brand{display:flex;gap:1.1rem;align-items:center}
.logo{width:62px;height:62px;flex:none;filter:drop-shadow(0 10px 16px color-mix(in srgb,var(--turq) 40%,transparent))}
h1{font:800 clamp(2.4rem,7vw,4.1rem)/.92 var(--head);margin:0;letter-spacing:-.035em}
.sub{margin:.6rem 0 0;color:var(--dim);font-size:.9rem;max-width:44ch;line-height:1.5}
.ctrl{display:flex;gap:.6rem;align-items:center}
.theme{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;transition:border-color .2s,transform .2s}
.theme:hover{border-color:var(--gold);transform:rotate(12deg)}
.theme svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i-sun{display:none}
:root[data-theme="dark"] .i-sun{display:block}
:root[data-theme="dark"] .i-moon{display:none}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{font:500 .85rem var(--mono);background:transparent;color:var(--dim);border:0;padding:.65rem .95rem;cursor:pointer;transition:background .2s,color .2s}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.bar{display:flex;justify-content:space-between;align-items:center;gap:1.2rem;flex-wrap:wrap;margin-bottom:1.3rem}
.modes{display:flex;gap:.6rem;flex-wrap:wrap}
.live{display:flex;gap:.8rem;align-items:center}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rb{fill:none;stroke:var(--line);stroke-width:5}
.ring .rf{fill:none;stroke:var(--turq);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring b{font:800 1.7rem var(--head)}
.ring.w b{font-size:1.02rem}
.ring i{font:500 .62rem var(--mono);color:var(--dim);margin-top:.25rem;font-style:normal}
.lv{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:.7rem 1.1rem;min-width:104px;box-shadow:var(--shadow)}
.lv b{display:block;font:800 1.9rem/1 var(--head)}
.lv i{font-style:normal;font-size:.72rem;color:var(--dim)}

.stage{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:22px;
  padding:2rem 2.3rem 1.5rem;overflow:hidden;cursor:text;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.stage:focus-within{border-color:var(--turq);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--turq) 18%,transparent),0 30px 70px -28px color-mix(in srgb,var(--turq) 55%,transparent)}
.stage::before,.stage::after{content:"";position:absolute;width:24px;height:24px;border:3px solid var(--gold);pointer-events:none;transition:border-color .2s}
.stage::before{left:12px;top:12px;border-right:0;border-bottom:0;border-radius:9px 0 0 0}
.stage::after{right:12px;bottom:12px;border-left:0;border-top:0;border-radius:0 0 9px 0}
.stage:focus-within::before,.stage:focus-within::after{border-color:var(--turq)}
.words{--lh:3.3rem;font-size:1.75rem;line-height:var(--lh);height:calc(var(--lh)*3);overflow:hidden;
  transition:opacity .2s;user-select:none;-webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent)}
.stage:not(:focus-within) .words{opacity:.35}
.inner{position:relative;transition:transform .15s}
.w{display:inline-block;white-space:pre}
.c{color:var(--dim)}
.c.ok{color:var(--ink)}
.c.bad{color:var(--bad);background:var(--badbg);border-radius:4px}
.c.cur{box-shadow:inset 3px 0 0 var(--turq);animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{box-shadow:inset 3px 0 0 transparent}}
.stage input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:text;font-size:16px}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:800 1.25rem var(--head);pointer-events:none;opacity:0;transition:opacity .2s}
.stage:not(:focus-within) .hint{opacity:1}

.kb{margin-top:1.4rem;text-align:center;background:var(--panel);border:1.5px solid var(--line);
  border-radius:22px;padding:1.1rem 1rem 1.4rem;box-shadow:var(--shadow)}
.kb.off{display:none}
.kb .lab{font:800 1.1rem var(--head);min-height:1.8rem;margin-bottom:.5rem}
.kb svg{width:100%;max-width:600px;height:auto}
.z-p{--z:#e4694f}.z-r{--z:#9b7bff}.z-m{--z:#17b3a8}.z-i{--z:#4a86ff}.z-t{--z:var(--dim)}
.k rect{fill:color-mix(in srgb,var(--z) 15%,var(--panel));stroke:color-mix(in srgb,var(--z) 45%,var(--line));stroke-width:1.5;transition:fill .12s}
.k text{font:600 15px var(--mono);fill:var(--dim)}
.k.on rect{fill:var(--gold);stroke:var(--gold)}
.k.on text{fill:var(--onGold)}
.bump{fill:var(--dim)}
.palm{fill:var(--panel2);stroke:var(--line);stroke-width:2}
.f{fill:color-mix(in srgb,var(--z) 14%,var(--panel));stroke:color-mix(in srgb,var(--z) 55%,var(--line));stroke-width:2;transition:fill .12s}
.f.on{fill:var(--gold);stroke:var(--gold)}

.foot{margin-top:1.1rem;font-size:.82rem;color:var(--dim);line-height:1.6;display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}
kbd{font:inherit;border:1px solid var(--line);border-radius:5px;padding:.05rem .4rem;background:var(--panel)}
.tog{font:500 .8rem var(--mono);background:var(--panel);color:var(--dim);border:1.5px solid var(--line);border-radius:999px;padding:.4rem .95rem;cursor:pointer}
.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--turq)}

.result{display:none;position:relative;overflow:hidden;background:var(--panel);border:1.5px solid var(--line);border-radius:22px;
  padding:2.4rem 2rem 2rem;box-shadow:var(--shadow)}
.result::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--turq),var(--gold),var(--bad))}
.result.show{display:block}
.rhead{display:flex;gap:1rem;align-items:center}
.medal{width:58px;height:58px;flex:none}
.level{font:800 1.4rem var(--head);margin:0}
.best{color:var(--dim);margin:.2rem 0 0;font-size:.88rem}
.best.new{color:var(--turq);font-weight:600}
.big{font:800 clamp(5rem,21vw,9.5rem)/.9 var(--head);letter-spacing:-.05em;margin:1.2rem 0 0;display:flex;align-items:flex-end;gap:.8rem}
.big small{font:500 .9rem/1.4 var(--mono);color:var(--dim);letter-spacing:0;padding-bottom:.8rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.8rem;margin:1.6rem 0 1.2rem}
.stats>div{background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.stats span{display:block;color:var(--dim);font-size:.78rem;margin-bottom:.25rem}
.stats b{font:800 1.8rem var(--head)}
.chartbox{background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:.9rem 1.1rem 1rem}
.cap{margin:0 0 .4rem;color:var(--dim);font-size:.8rem}
#chart{width:100%;height:auto;display:block}
#chart text{font:500 12px var(--mono);fill:var(--dim)}
#chart .ax{stroke:var(--line);stroke-width:1.5}
#chart .ln{fill:none;stroke:var(--turq);stroke-width:2.5;stroke-linejoin:round}
#chart circle{fill:var(--turq)}
.weak{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:1.2rem 0 0;font-size:.85rem;color:var(--dim)}
.chip{border:1.5px solid var(--line);background:var(--panel2);border-radius:8px;padding:.2rem .6rem;color:var(--ink)}
.chip b{color:var(--bad);margin-right:.35rem}
.advice{margin:1.2rem 0 1.6rem;line-height:1.6;max-width:62ch}
.acts{display:flex;gap:.7rem;flex-wrap:wrap}
.again{font:600 1rem var(--mono);background:var(--gold);color:var(--onGold);border:0;border-radius:12px;padding:.9rem 1.6rem;cursor:pointer;
  box-shadow:0 10px 24px -12px var(--gold);transition:transform .15s}
.again:hover{transform:translateY(-2px)}
.ghost{font:500 1rem var(--mono);background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:.9rem 1.4rem;cursor:pointer}
.ghost:hover{border-color:var(--turq)}
button:focus-visible{outline:2px solid var(--turq);outline-offset:2px}
@media (max-width:560px){
  .words{font-size:1.2rem;--lh:2.4rem}.stage{padding:1.4rem 1.1rem 1rem}
  .kb,.tog{display:none}.live{width:100%;justify-content:space-between}.lv{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  ["Lp","Lr","Lm","Li","Li","Ri","Ri","Rm","Rr","Rp"]
];
const FN={Lp:"Chap kichik barmoq",Lr:"Chap nomsiz barmoq",Lm:"Chap o‘rta barmoq",Li:"Chap ko‘rsatkich barmoq",Lt:"Chap bosh barmoq",
  Rt:"O‘ng bosh barmoq",Ri:"O‘ng ko‘rsatkich barmoq",Rm:"O‘ng o‘rta barmoq",Rr:"O‘ng nomsiz barmoq",Rp:"O‘ng kichik barmoq"};
const OFF=[0,12,36], FX={Lp:36,Lr:84,Lm:132,Li:180,Ri:324,Rm:372,Rr:420,Rp:468}, FT={p:238,r:220,m:210,i:222};

const $ = id => document.getElementById(id);
const stage=$("stage"), inner=$("inner"), words=$("words"), inp=$("inp"), result=$("result");
const ringC=$("ringc"), CIRC=2*Math.PI*27;
ringC.style.strokeDasharray=CIRC;
const prog={style:{}};
Object.defineProperty(prog.style,"width",{set(v){ ringC.style.strokeDashoffset=CIRC*(1-Math.min(100,parseFloat(v)||0)/100); }});
let lang="uz", mode="t", n=30, kbOn=true;
let target="", els=[], started=false, done=false, t0=0, timer=null;
let total=0, good=0, prevLen=0, errs={}, samples=[], lastSec=0, lastTotal=0, keyMap={}, hl=[];

try{
  const s=localStorage.getItem("tezyozish-lang"); if(LISTS[s]) lang=s;
  if(localStorage.getItem("tezyozish-kb")==="0") kbOn=false;
}catch(e){}

// ' ‘ ’ ʻ ` ´ belgilari bir xil hisoblanadi
const norm = c => ("'‘’ʻ`´").indexOf(c)>-1 ? "'" : c;
const show = c => (lang==="uz" && c==="'") ? "ʻ" : c;

function gen(){
  const src=LISTS[lang].split(" "), list=[], count=mode==="t"?260:n;
  while(list.length<count) list.push(src[Math.floor(Math.random()*src.length)]);
  target=list.join(" ")+" ";
  inner.innerHTML=""; els=[]; inner.style.transform="translateY(0)";
  list.forEach(w=>{
    const ws=document.createElement("span"); ws.className="w";
    (w+" ").split("").forEach(ch=>{
      const s=document.createElement("span"); s.className="c"; s.textContent=show(ch);
      ws.appendChild(s); els.push(s);
    });
    inner.appendChild(ws);
  });
  els[0].classList.add("cur");
}

function buildKb(){
  const rows=ROWS[lang==="ru"?"ru":"en"]; let h="";
  keyMap={};
  rows.forEach((r,ri)=>[...r].forEach((ch,i)=>{
    const x=OFF[ri]+i*48, y=ri*48, id="k"+ri+"_"+i;
    keyMap[ch]={f:FING[ri][i],id};
    h+=`<g class="k z-${FING[ri][i][1]}" id="${id}"><rect x="${x}" y="${y}" width="42" height="42" rx="8"/><text x="${x+21}" y="${y+27}" text-anchor="middle">${ch.toUpperCase()}</text></g>`;
    if(ri===1&&(i===3||i===6)) h+=`<rect class="bump" x="${x+14}" y="${y+34}" width="14" height="2.5" rx="1"/>`;
  }));
  keyMap[" "]={f:"Rt",id:"ksp"};
  h+=`<g class="k z-t" id="ksp"><rect x="122" y="146" width="260" height="38" rx="8"/><text x="252" y="170" text-anchor="middle">bo‘sh joy</text></g>`;
  h+=`<rect class="f z-t" id="fLt" x="191" y="269" width="28" height="72" rx="14" transform="rotate(40 205 305)"/>`;
  h+=`<rect class="f z-t" id="fRt" x="285" y="269" width="28" height="72" rx="14" transform="rotate(-40 299 305)"/>`;
  for(const k in FX){ const t=FT[k[1]]; h+=`<rect class="f z-${k[1]}" id="f${k}" x="${FX[k]-15}" y="${t}" width="30" height="${312-t}" rx="15"/>`; }
  h+=`<rect class="palm" x="12" y="284" width="192" height="60" rx="28"/><rect class="palm" x="300" y="284" width="192" height="60" rx="28"/>`;
  $("ksvg").innerHTML=h; hl=[];
}

function guide(){
  hl.forEach(e=>e.classList.remove("on")); hl=[];
  const lab=$("klab"), c=target[inp.value.length];
  const m=c!==undefined && keyMap[c];
  if(!m){ lab.textContent=""; return; }
  [$(m.id),$("f"+m.f)].forEach(e=>{ e.classList.add("on"); hl.push(e); });
  lab.textContent=FN[m.f]+" · "+(c===" "?"bo‘sh joy":c.toUpperCase());
}

function render(){
  const v=inp.value;
  for(let i=0;i<els.length;i++){
    let cls="c";
    if(i<v.length) cls+= norm(v[i])===target[i] ? " ok" : " bad";
    else if(i===v.length) cls+=" cur";
    if(els[i].className!==cls) els[i].className=cls;
  }
  const cur=els[Math.min(v.length,els.length-1)];
  const lh=parseFloat(getComputedStyle(words).lineHeight);
  inner.style.transform="translateY(-"+Math.max(0,cur.parentElement.offsetTop-lh)+"px)";
  guide();
}

function correctCount(){
  const v=inp.value; let c=0;
  for(let i=0;i<v.length;i++) if(norm(v[i])===target[i]) c++;
  return c;
}

function sample(el){
  const s=Math.floor(el);
  while(lastSec<s){ lastSec++; samples.push((total-lastTotal)*12); lastTotal=total; }
}

function tick(){
  const el=(performance.now()-t0)/1000;
  if(mode==="t"){
    if(el>=n){ sample(n); prog.style.width="100%"; finish(n); return; }
    $("v1").textContent=Math.ceil(n-el);
    prog.style.width=(el/n*100)+"%";
  }
  sample(el);
  $("lwpm").textContent=Math.round(correctCount()/5/Math.max(el/60,1/600));
  $("lacc").textContent=total?Math.round(good/total*100)+"%":"—";
}

function consistency(){
  if(samples.length<3) return null;
  const m=samples.reduce((a,b)=>a+b,0)/samples.length;
  if(!m) return 0;
  const sd=Math.sqrt(samples.reduce((a,b)=>a+(b-m)**2,0)/samples.length);
  return Math.max(0,Math.round(100-sd/m*100));
}

function drawChart(){
  const c=$("chart"), s=samples, ok=s.length>=2;
  c.style.display=ok?"":"none"; $("ccap").style.display=ok?"":"none";
  if(!ok) return;
  const max=Math.max(20,Math.ceil(Math.max(...s)/10)*10), W=550, H=100, X0=40, Y0=10;
  const pts=s.map((v,i)=>[X0+i/(s.length-1)*W, Y0+H-v/max*H]);
  let h=`<line class="ax" x1="${X0}" y1="${Y0+H}" x2="${X0+W}" y2="${Y0+H}"/><line class="ax" x1="${X0}" y1="${Y0}" x2="${X0+W}" y2="${Y0}"/>`;
  h+=`<text x="0" y="${Y0+4}">${max}</text><text x="0" y="${Y0+H+4}">0</text>`;
  h+=`<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--turq);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--turq);stop-opacity:0"/></linearGradient></defs><polygon fill="url(#cg)" points="${X0},${Y0+H} ${pts.map(p=>p.join(",")).join(" ")} ${X0+W},${Y0+H}"/>`;
  h+=`<polyline class="ln" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  pts.forEach(p=>{ h+=`<circle cx="${p[0]}" cy="${p[1]}" r="3"/>`; });
  h+=`<text x="${X0}" y="${Y0+H+24}">1 s</text><text x="${X0+W}" y="${Y0+H+24}" text-anchor="end">${s.length} s</text>`;
  c.innerHTML=h;
}

function finish(elapsed){
  clearInterval(timer); done=true; inp.blur();
  const mins=elapsed/60, ok=correctCount();
  const wpm=Math.round(ok/5/mins), raw=Math.round(total/5/mins);
  const acc=total?Math.round(good/total*100):0, cons=consistency();
  countUp($("rwpm"),wpm); $("rraw").textContent=raw; $("racc").textContent=acc+"%";
  $("rcons").textContent=cons===null?"—":cons+"%";
  $("rerr").textContent=total-good;
  $("rdur").textContent=(mode==="t"?n:elapsed.toFixed(1))+" s";
  $("rlevel").textContent=LEVELS.find(l=>wpm<l[0])[1];
  drawChart();
  lastShare=`Men "Tez yozish"da ${wpm} so‘z/daq tezlikda yozdim (aniqlik ${acc}%)! ${location.href}`;

  const top=Object.entries(errs).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $("weak").innerHTML = top.length
    ? "Eng ko‘p xato qilingan belgilar: "+top.map(([c,k])=>`<span class="chip"><b>${c===" "?"bo‘sh joy":show(c)}</b>${k}</span>`).join("")
    : "Xatosiz yozdingiz. Barakalla!";

  let adv;
  if(acc<90) adv="Aniqlik past. Tezlikni biroz pasaytirib, xatosiz yozishga harakat qiling: tezlik aniqlikdan keyin keladi.";
  else if(cons!==null && cons<65) adv="Tezligingiz notekis. To‘xtamasdan, bir me’yorda yozib ko‘ring.";
  else if(wpm<30) adv="Barmoqlarni klaviaturadagi ko‘rsatma bo‘yicha joylashtirib mashq qiling. Ko‘zingiz ekranda, qo‘llaringiz klaviaturada bo‘lsin.";
  else adv="Zo‘r natija! Endi rekordingizni yangilashga harakat qiling.";
  $("radv").textContent=adv;

  const key="tezyozish-best-"+lang+"-"+mode+n; let best=0;
  try{ best=parseInt(localStorage.getItem(key)||"0",10)||0; }catch(e){}
  const b=$("rbest");
  if(wpm>best && wpm>0){
    b.textContent="Yangi rekord!"; b.className="best new";
    try{ localStorage.setItem(key,String(wpm)); }catch(e){}
  }else{
    b.textContent="Eng yaxshi natija: "+best+" so‘z/daq"; b.className="best";
  }
  stage.style.display="none"; $("foot").style.display="none"; $("kb").style.display="none";
  result.classList.add("show"); $("again").focus();
}

function reset(){
  clearInterval(timer);
  started=false; done=false; total=0; good=0; prevLen=0; inp.value="";
  errs={}; samples=[]; lastSec=0; lastTotal=0;
  $("v1").textContent = mode==="t" ? n : "0/"+n;
  $("lab1").textContent = mode==="t" ? "soniya" : "so‘z";
  $("lwpm").textContent="0"; $("lacc").textContent="—"; $("ring").classList.toggle("w",mode==="w"); prog.style.width="0";
  document.querySelector(".hint").textContent=UI[lang].hint;
  $("fhint").innerHTML="<kbd>Tab</kbd> — qayta boshlash."+UI[lang].apos;
  result.classList.remove("show");
  stage.style.display=""; $("foot").style.display=""; $("kb").style.display="";
  $("kb").classList.toggle("off",!kbOn);
  $("kbtog").setAttribute("aria-pressed",String(kbOn));
  gen(); buildKb(); guide(); inp.focus();
}

inp.addEventListener("input",()=>{
  if(done) return;
  let v=inp.value;
  if(v.length>target.length){ v=inp.value=v.slice(0,target.length); }
  if(!started){ started=true; t0=performance.now(); timer=setInterval(tick,100); }
  if(v.length>prevLen){
    total++;
    if(norm(v[v.length-1])===target[v.length-1]) good++;
    else { const e=target[v.length-1]; errs[e]=(errs[e]||0)+1; }
  }
  prevLen=v.length;
  render();
  if(mode==="w"){
    const wd=(target.slice(0,v.length).match(/ /g)||[]).length;
    $("v1").textContent=wd+"/"+n; prog.style.width=(wd/n*100)+"%";
    if(v.length>=target.length-1) finish((performance.now()-t0)/1000);
  }
});
inp.addEventListener("paste",e=>e.preventDefault());
inp.addEventListener("keydown",e=>{ if(/^(Arrow|Home|End)/.test(e.key)) e.preventDefault(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Tab" || (done && e.key==="Enter")){ e.preventDefault(); reset(); }
});
$("again").addEventListener("click",reset);

$("kbtog").addEventListener("click",()=>{
  kbOn=!kbOn;
  try{ localStorage.setItem("tezyozish-kb",kbOn?"1":"0"); }catch(e){}
  $("kb").classList.toggle("off",!kbOn);
  $("kbtog").setAttribute("aria-pressed",String(kbOn));
  inp.focus();
});

const mbs=document.querySelectorAll(".mb");
function markModes(){ mbs.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===mode && +b.dataset.n===n))); }
mbs.forEach(b=>b.addEventListener("click",()=>{ mode=b.dataset.m; n=+b.dataset.n; markModes(); reset(); }));

const lbs=document.querySelectorAll("#langs button");
function markLangs(){ lbs.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang))); document.documentElement.lang=lang; }
lbs.forEach(b=>b.addEventListener("click",()=>{
  lang=b.dataset.l; markLangs();
  try{ localStorage.setItem("tezyozish-lang",lang); }catch(e){}
  reset();
}));

let lastShare="";
function countUp(el,to){
  if(!to || matchMedia("(prefers-reduced-motion:reduce)").matches){ el.textContent=to; return; }
  const s=performance.now(), d=800;
  (function f(t){
    const p=Math.min(1,(t-s)/d);
    el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
    if(p<1) requestAnimationFrame(f);
  })(s);
}
$("share").addEventListener("click",async()=>{
  const b=$("share"); let ok=false;
  try{ await navigator.clipboard.writeText(lastShare); ok=true; }catch(e){}
  b.textContent=ok?"Nusxalandi":"Nusxalab bo‘lmadi";
  setTimeout(()=>{ b.textContent="Natijani nusxalash"; },1600);
});

const TC={light:"#eaf4f5",dark:"#060f24"};
function setTheme(t,save){
  document.documentElement.dataset.theme=t; $("tc").content=TC[t];
  if(save){ try{ localStorage.setItem("tezyozish-theme",t); }catch(e){} }
}
setTheme(document.documentElement.dataset.theme,false);
$("theme").addEventListener("click",()=>{
  setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark",true);
  if(!done) inp.focus();
});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",e=>{
  let saved=null; try{ saved=localStorage.getItem("tezyozish-theme"); }catch(x){}
  if(!saved) setTheme(e.matches?"dark":"light",false);
});

markModes(); markLangs(); reset();
</script>
</body>
</html>
