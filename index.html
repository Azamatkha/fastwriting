<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tez yozish — yozish tezligini tekshiring</title>
<meta name="description" content="Yozish tezligingizni so‘z/daqiqada o‘lchang va o‘n barmoqlab yozishni o‘rganing. O‘zbek, rus va ingliz tillarida.">
<meta name="theme-color" content="#eef3fa" id="tc">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2048%2048%27%3E%3Crect%20x%3D%278%27%20y%3D%278%27%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%273%27%20fill%3D%27%230a8c8a%27/%3E%3Crect%20x%3D%278%27%20y%3D%278%27%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%273%27%20fill%3D%27%23e3a41f%27%20transform%3D%27rotate%2845%2024%2024%29%27/%3E%3Ccircle%20cx%3D%2724%27%20cy%3D%2724%27%20r%3D%279%27%20fill%3D%27%23ffffff%27/%3E%3Ccircle%20cx%3D%2724%27%20cy%3D%2724%27%20r%3D%273.5%27%20fill%3D%27%23c8402f%27/%3E%3C/svg%3E">
<script>
(function(){var t;try{t=localStorage.getItem("tezyozish-theme")}catch(e){}
if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
document.documentElement.dataset.theme=t;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3fa; --panel:#ffffff; --panel2:#f3f7fc; --ink:#0f2557; --dim:#7a8cab;
  --turq:#0e9f9a; --gold:#f2b01e; --onGold:#10265a; --bad:#e04b3a; --badbg:#fde3de; --line:#d5e0ee;
  --hand:#8fa6cf; --handline:#6f88b8;
  --glow1:rgba(14,159,154,.15); --glow2:rgba(242,176,30,.15);
  --shadow:0 18px 40px -24px rgba(15,37,87,.4);
  --tile:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%230e9f9a' stroke-opacity='.12' stroke-width='1.3'><path d='M36 8l8 20 20 8-20 8-8 20-8-20-20-8 20-8z'/></g><g fill='%23f2b01e' fill-opacity='.2'><circle cx='0' cy='0' r='2'/><circle cx='72' cy='0' r='2'/><circle cx='0' cy='72' r='2'/><circle cx='72' cy='72' r='2'/></g></svg>");
  --head:"Bricolage Grotesque",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;
}
:root[data-theme="dark"]{
  --bg:#070e22; --panel:#0e1b3e; --panel2:#132452; --ink:#eef3ff; --dim:#8296c2;
  --turq:#3fe0d0; --gold:#ffc84a; --onGold:#0a1633; --bad:#ff8a7a; --badbg:#4d2433; --line:#24396e;
  --hand:#b4c6ee; --handline:#8ea8dd;
  --glow1:rgba(63,224,208,.13); --glow2:rgba(255,200,74,.08);
  --shadow:0 26px 60px -26px rgba(0,0,0,.85);
  --tile:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%233fe0d0' stroke-opacity='.08' stroke-width='1.3'><path d='M36 8l8 20 20 8-20 8-8 20-8-20-20-8 20-8z'/></g><g fill='%23ffc84a' fill-opacity='.14'><circle cx='0' cy='0' r='2'/><circle cx='72' cy='0' r='2'/><circle cx='0' cy='72' r='2'/><circle cx='72' cy='72' r='2'/></g></svg>");
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:var(--mono);min-height:100vh;
  background:radial-gradient(900px 520px at 8% -8%,var(--glow1),transparent 62%),
    radial-gradient(820px 520px at 100% 108%,var(--glow2),transparent 62%),var(--tile),var(--bg);
  transition:background-color .3s,color .3s}
.s1{fill:var(--turq)}.s2{fill:var(--gold)}.s3{fill:var(--panel)}.s4{fill:var(--bad)}
.z-p{--z:#ff7a6a}.z-r{--z:#a58bff}.z-m{--z:#2fd3c0}.z-i{--z:#5b9dff}.z-t{--z:var(--dim)}
.band{height:34px;color:var(--turq);border-bottom:1.5px solid var(--line);overflow:hidden;background:var(--panel)}
.band svg{display:block;width:100%;height:100%}
main{max-width:940px;margin:0 auto;padding:18px 16px 48px}

.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.brand{display:flex;gap:.85rem;align-items:center;min-width:0}
.logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 8px 14px color-mix(in srgb,var(--turq) 40%,transparent))}
h1{font:800 clamp(1.8rem,4.5vw,2.5rem)/.95 var(--head);margin:0;letter-spacing:-.035em}
.sub{margin:.35rem 0 0;color:var(--dim);font-size:.78rem;max-width:46ch;line-height:1.45}
@media (max-height:860px){.sub{display:none}}
.ctrl{display:flex;gap:.6rem;align-items:center}
.theme{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;transition:border-color .2s,transform .2s}
.theme:hover{border-color:var(--gold);transform:rotate(12deg)}
.theme svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i-sun{display:none}
:root[data-theme="dark"] .i-sun{display:block}
:root[data-theme="dark"] .i-moon{display:none}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{font:500 .85rem var(--mono);background:transparent;color:var(--dim);border:0;padding:.6rem .9rem;cursor:pointer;transition:background .2s,color .2s}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#tabs button[aria-pressed="true"]{background:var(--gold);color:var(--onGold);font-weight:600}

.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.modes{display:flex;gap:.6rem;flex-wrap:wrap}
.modes[hidden]{display:none}
.live{display:flex;gap:.7rem;align-items:center}
.ring{position:relative;width:66px;height:66px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rb{fill:none;stroke:var(--line);stroke-width:5}
.ring .rf{fill:none;stroke:var(--turq);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring b{font:800 1.35rem var(--head)}
.ring.wm b{font-size:.85rem}
.ring i{font:500 .55rem var(--mono);color:var(--dim);margin-top:.15rem;font-style:normal}
.lv{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:.45rem .85rem;min-width:88px;box-shadow:var(--shadow)}
.lv b{display:block;font:800 1.45rem/1 var(--head)}
.lv i{font-style:normal;font-size:.7rem;color:var(--dim)}

.lessons{margin:0 0 .8rem;padding:.8rem 1rem .9rem;background:var(--panel);border:1.5px solid var(--line);border-radius:16px}
.lessons[hidden]{display:none}
.lh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.55rem}
.lh b{font:800 1.05rem var(--head)}
.lh span{font-size:.78rem;color:var(--dim)}
.lrow{position:relative;display:flex;gap:.45rem;overflow-x:auto;padding:.1rem .1rem .5rem;scrollbar-width:thin}
.lc{flex:none;min-width:84px;text-align:left;font:500 .8rem var(--mono);color:var(--ink);cursor:pointer;
  background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:.45rem .7rem;position:relative}
.lc .ln{display:block;font-size:.68rem;color:var(--dim)}
.lc .lk{display:block;font-weight:600;letter-spacing:.08em;margin-top:.1rem;white-space:nowrap}
.lc i{position:absolute;right:.45rem;top:.35rem;font-style:normal;color:var(--turq);font-weight:700}
.lc.done{border-color:color-mix(in srgb,var(--turq) 60%,var(--line))}
.lc[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lc[aria-pressed="true"] .ln{color:inherit;opacity:.7}
.ldesc{margin:.2rem 0 0;font-size:.82rem;line-height:1.7}
.dk{display:inline-block;min-width:1.7em;text-align:center;border-radius:6px;padding:0 .3em;font-weight:600;
  background:color-mix(in srgb,var(--z) 24%,transparent);border:1px solid color-mix(in srgb,var(--z) 60%,transparent)}

.stage{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:20px;
  padding:1.2rem 1.8rem .9rem;overflow:hidden;cursor:text;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.stage:focus-within{border-color:var(--turq);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--turq) 18%,transparent),0 30px 70px -28px color-mix(in srgb,var(--turq) 55%,transparent)}
.stage::before,.stage::after{content:"";position:absolute;width:22px;height:22px;border:3px solid var(--gold);pointer-events:none;transition:border-color .2s}
.stage::before{left:11px;top:11px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.stage::after{right:11px;bottom:11px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.stage:focus-within::before,.stage:focus-within::after{border-color:var(--turq)}
.words{--lh:2.8rem;font-size:1.55rem;line-height:var(--lh);height:calc(var(--lh)*3);overflow:hidden;
  transition:opacity .2s;user-select:none;-webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent)}
.stage:not(:focus-within) .words{opacity:.35}
.inner{position:relative;transition:transform .15s}
.wd{display:inline-block;white-space:pre}
.c{color:var(--dim)}
.c.ok{color:var(--ink)}
.c.bad{color:var(--bad);background:var(--badbg);border-radius:4px}
.c.cur{box-shadow:inset 3px 0 0 var(--turq);animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{box-shadow:inset 3px 0 0 transparent}}
.stage input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:text;font-size:16px}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:800 1.25rem var(--head);pointer-events:none;opacity:0;transition:opacity .2s}
.stage:not(:focus-within) .hint{opacity:1}

.kb{margin-top:1rem;text-align:center;background:var(--panel);border:1.5px solid var(--line);
  border-radius:20px;padding:.7rem .8rem .8rem;box-shadow:var(--shadow)}
.kb.off{display:none}
.kb .lab{font:800 1rem var(--head);min-height:1.5rem;margin-bottom:.3rem}
.kb svg{width:100%;max-width:640px;max-height:44vh;height:auto;overflow:visible}
.kr{fill:color-mix(in srgb,var(--z) 10%,var(--panel2));stroke:color-mix(in srgb,var(--z) 75%,var(--panel));stroke-width:1.5}
.kl text{font:600 15px var(--mono);fill:color-mix(in srgb,var(--z,var(--dim)) 65%,var(--ink));text-anchor:middle}
.kl text.on{fill:var(--onGold)}
.bump{fill:var(--dim)}
#hk{fill:var(--gold);stroke:var(--gold);filter:drop-shadow(0 0 7px color-mix(in srgb,var(--gold) 75%,transparent))}
#conn{stroke:var(--gold);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1 6;fill:none}
.hs{fill:url(#hg);stroke:var(--handline);stroke-width:1.6;stroke-linejoin:round}
.fo{fill:url(#gg);opacity:0;transition:opacity .12s}
.fo.on{opacity:1}

.foot{margin-top:.7rem;font-size:.82rem;color:var(--dim);line-height:1.6;display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}
kbd{font:inherit;border:1px solid var(--line);border-radius:5px;padding:.05rem .4rem;background:var(--panel)}
.tog{font:500 .8rem var(--mono);background:var(--panel);color:var(--dim);border:1.5px solid var(--line);border-radius:999px;padding:.4rem .95rem;cursor:pointer}
.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--turq)}

.result{display:none;position:relative;overflow:hidden;background:var(--panel);border:1.5px solid var(--line);border-radius:22px;
  padding:2.4rem 2rem 2rem;box-shadow:var(--shadow)}
.result::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--turq),var(--gold),var(--bad))}
.result.show{display:block}
.rhead{display:flex;gap:1rem;align-items:center}
.medal{width:58px;height:58px;flex:none}
.level{font:800 1.4rem var(--head);margin:0}
.best{color:var(--dim);margin:.2rem 0 0;font-size:.88rem}
.best.new{color:var(--turq);font-weight:600}
.big{font:800 clamp(5rem,21vw,9.5rem)/.9 var(--head);letter-spacing:-.05em;margin:1.2rem 0 0;display:flex;align-items:flex-end;gap:.8rem}
.big small{font:500 .9rem/1.4 var(--mono);color:var(--dim);letter-spacing:0;padding-bottom:.8rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.8rem;margin:1.6rem 0 1.2rem}
.stats>div{background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.stats span{display:block;color:var(--dim);font-size:.78rem;margin-bottom:.25rem}
.stats b{font:800 1.8rem var(--head)}
.chartbox{background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:.9rem 1.1rem 1rem}
.cap{margin:0 0 .4rem;color:var(--dim);font-size:.8rem}
#chart{width:100%;height:auto;display:block}
#chart text{font:500 12px var(--mono);fill:var(--dim)}
#chart .ax{stroke:var(--line);stroke-width:1.5}
#chart .ln{fill:none;stroke:var(--turq);stroke-width:2.5;stroke-linejoin:round}
#chart circle{fill:var(--turq)}
.weak{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:1.2rem 0 0;font-size:.85rem;color:var(--dim)}
.chip{border:1.5px solid var(--line);background:var(--panel2);border-radius:8px;padding:.2rem .6rem;color:var(--ink)}
.chip b{color:var(--bad);margin-right:.35rem}
.advice{margin:1.2rem 0 1.6rem;line-height:1.6;max-width:62ch}
.acts{display:flex;gap:.7rem;flex-wrap:wrap}
.again{font:600 1rem var(--mono);background:var(--gold);color:var(--onGold);border:0;border-radius:12px;padding:.9rem 1.6rem;cursor:pointer;
  box-shadow:0 10px 24px -12px var(--gold);transition:transform .15s}
.again:hover{transform:translateY(-2px)}
.again[hidden]{display:none}
.ghost{font:500 1rem var(--mono);background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:.9rem 1.4rem;cursor:pointer}
.ghost:hover{border-color:var(--turq)}
button:focus-visible{outline:2px solid var(--turq);outline-offset:2px}
@media (max-width:560px){
  .words{font-size:1.2rem;--lh:2.4rem}.stage{padding:1.2rem 1rem .9rem}
  .kb,.tog{display:none}.live{width:100%;justify-content:space-between}.lv{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 48 48">
    <rect class="s1" x="8" y="8" width="32" height="32" rx="3"/>
    <rect class="s2" x="8" y="8" width="32" height="32" rx="3" transform="rotate(45 24 24)"/>
    <circle class="s3" cx="24" cy="24" r="9"/>
    <circle class="s4" cx="24" cy="24" r="3.5"/>
  </symbol>
</svg>
<div class="band" aria-hidden="true">
  <svg preserveAspectRatio="none">
    <defs>
      <pattern id="p" width="34" height="34" patternUnits="userSpaceOnUse">
        <path d="M17 3 L31 17 L17 31 L3 17Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M17 10 L24 17 L17 24 L10 17Z" fill="currentColor"/>
        <circle class="s2" cx="0" cy="17" r="2.4"/><circle class="s2" cx="34" cy="17" r="2.4"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#p)"/>
  </svg>
</div>
<main>
  <header class="top">
    <div class="brand">
      <svg class="logo" aria-hidden="true"><use href="#star"/></svg>
      <div>
        <h1>Tez yozish</h1>
        <p class="sub">Matnni xatosiz va tez yozing. Vaqt birinchi harfni bosganingizda boshlanadi.</p>
      </div>
    </div>
    <div class="ctrl">
      <button class="theme" id="theme" aria-label="Kun yoki tun rejimini almashtirish" title="Kun / tun rejimi">
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="seg" id="langs" role="group" aria-label="Til">
        <button data-l="uz" aria-pressed="true">O‘zbek</button>
        <button data-l="ru" aria-pressed="false">Русский</button>
        <button data-l="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <div class="bar">
    <div class="modes">
      <div class="seg" id="tabs" role="group" aria-label="Bo‘lim">
        <button data-t="test" aria-pressed="true">Test</button>
        <button data-t="learn" aria-pressed="false">Darslar</button>
      </div>
      <div class="modes" id="tm">
        <div class="seg" role="group" aria-label="Vaqt bo‘yicha test">
          <button class="mb" data-m="t" data-n="15">15 s</button>
          <button class="mb" data-m="t" data-n="30">30 s</button>
          <button class="mb" data-m="t" data-n="60">60 s</button>
        </div>
        <div class="seg" role="group" aria-label="So‘z soni bo‘yicha test">
          <button class="mb" data-m="w" data-n="50">50 so‘z</button>
          <button class="mb" data-m="w" data-n="100">100 so‘z</button>
          <button class="mb" data-m="w" data-n="200">200 so‘z</button>
        </div>
      </div>
    </div>
    <div class="live">
      <div class="ring" id="ring">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="rb" cx="32" cy="32" r="27"/><circle class="rf" id="ringc" cx="32" cy="32" r="27"/></svg>
        <div><b id="v1">30</b><i id="lab1">soniya</i></div>
      </div>
      <div class="lv"><b id="lwpm">0</b><i>so‘z/daq</i></div>
      <div class="lv"><b id="lacc">—</b><i>aniqlik</i></div>
    </div>
  </div>

  <section class="lessons" id="lessons" hidden>
    <div class="lh"><b>Darslar</b><span id="lprog">0/19</span></div>
    <div class="lrow" id="lrow"></div>
    <p class="ldesc" id="ldesc"></p>
  </section>

  <div class="stage" id="stage">
    <div class="words" id="words"><div class="inner" id="inner"></div></div>
    <div class="hint">Yozishni boshlash uchun bosing</div>
    <input id="inp" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Matnni shu yerga yozing">
  </div>

  <div class="kb" id="kb">
    <div class="lab" id="klab"></div>
    <svg id="ksvg" viewBox="-8 -8 596 268" aria-hidden="true"></svg>
  </div>

  <div class="foot" id="foot">
    <span id="fhint"></span>
    <button class="tog" id="kbtog" aria-pressed="true">Klaviatura ko‘rsatmasi</button>
  </div>

  <section class="result" id="result" aria-live="polite">
    <div class="rhead">
      <svg class="medal" aria-hidden="true"><use href="#star"/></svg>
      <div><p class="level" id="rlevel"></p><p class="best" id="rbest"></p></div>
    </div>
    <div class="big"><span id="rwpm">0</span><small>so‘z/daq<br>sof tezlik</small></div>
    <div class="stats">
      <div><span>Xom tezlik</span><b id="rraw">0</b></div>
      <div><span>Aniqlik</span><b id="racc">0%</b></div>
      <div><span>Barqarorlik</span><b id="rcons">—</b></div>
      <div><span>Xatolar</span><b id="rerr">0</b></div>
      <div><span>Vaqt</span><b id="rdur">0 s</b></div>
    </div>
    <div class="chartbox">
      <p class="cap" id="ccap">Soniyalar bo‘yicha tezlik</p>
      <svg id="chart" viewBox="0 0 600 140" aria-hidden="true"></svg>
    </div>
    <div class="weak" id="weak"></div>

function getLessons(){
  const rows=ROWS[lang==="ru"?"ru":"en"].map(r=>[...r]);
  const kk=SPEC.map(sp=>{
    if(sp[0]==="all"){ const a=[]; rows.forEach(r=>a.push(...r)); return a; }
    return sp[1]==="all" ? [...rows[sp[0]]] : sp[1].map(c=>rows[sp[0]][c]);
  });
  const fingerOf=k=>{ for(let r=0;r<3;r++){ const c=rows[r].indexOf(k); if(c>-1) return FING[r][c]; } return "Li"; };
  return kk.map((keys,i)=>{
    const st=i<6?0:i<12?6:i<18?12:18, pool=[], known=[];
    for(let j=st;j<=i;j++) kk[j].forEach(k=>{ if(!pool.includes(k)) pool.push(k); });
    for(let j=0;j<=i;j++) kk[j].forEach(k=>{ if(!known.includes(k)) known.push(k); });
    const isAll=keys.length>2;
    return {
      keys, pool, known,
      label: isAll ? ALLNAMES[i] : keys.map(k=>k.toUpperCase()).join(" "),
      desc: isAll ? "Qatordagi barcha tugmalar: har bir barmoq o‘z ustunida ishlaydi."
        : keys.map(k=>`<span class="dk z-${fingerOf(k)[1]}">${k.toUpperCase()}</span> — ${FN[fingerOf(k)]}`).join(" &nbsp; ")
    };
  });
}

function genLesson(){
  const l=LS[li], out=[];
  const cand=LISTS[lang].split(" ").filter(w=>[...w].every(c=>l.known.includes(norm(c))) && [...w].some(c=>l.keys.includes(norm(c))));
  while(out.length<n){
    if(cand.length>=6 && Math.random()<.5){ out.push(pick(cand)); continue; }
    let w=""; const L=2+Math.floor(Math.random()*4);
    for(let i=0;i<L;i++) w+= Math.random()<.65 ? pick(l.keys) : pick(l.pool);
    out.push(w);
  }
  return out;
}

function buildLessons(){
  LS=getLessons(); if(li>=LS.length) li=0;

  row.querySelectorAll(".lc").forEach(b=>b.addEventListener("click",()=>{ li=+b.dataset.i; reset(); }));
  const cur=row.children[li];
  if(cur) row.scrollLeft=cur.offsetLeft-row.clientWidth/2+cur.clientWidth/2;
  $("ldesc").innerHTML=`<b>${li+1}-dars.</b> `+LS[li].desc;
}

function tipPath(cx,hw,t,yBottom){
  return `L${cx-hw+1},${t+16} C${cx-hw+1},${t+6} ${cx-8},${t} ${cx},${t} C${cx+8},${t} ${cx+hw-1},${t+6} ${cx+hw-1},${t+16}`;
}
function handShape(){
  let d="M18,150 ", prev=null;
  HW.forEach(([,cx,hw,t,yl,yr])=>{
    if(prev) d+=`Q${(prev.x+cx-hw)/2},${Math.max(prev.y,yl)+8} ${cx-hw},${yl} `;
    d+=`L${cx-hw},${yl} `+tipPath(cx,hw,t)+` L${cx+hw},${yr} `;
    prev={x:cx+hw,y:yr};
  });
  return d+"L196,166 Q196,174 202,170.5 L211.7,160.3 A17,17 0 0 1 236.3,183.7 L196.3,225.7 C190,236 178,244 168,250 L62,250 C30,238 6,206 10,178 C11,164 14,154 18,150Z";
}
function handG(pre,mirror){
  let o=`<g${mirror?' transform="translate(498,0) scale(-1,1)"':""}><path class="hs" d="${handShape()}"/>`;
  HW.forEach(([c,cx,hw,t])=>{ o+=`<path class="fo" id="f${pre}${c}" d="M${cx-hw},128 ${tipPath(cx,hw,t)} L${cx+hw},128Z"/>`; });

  return o+"</g>";
}

function buildKb(){
  const rows=ROWS[lang==="ru"?"ru":"en"]; let keys="", labs="";
  keyMap={};
  rows.forEach((r,ri)=>[...r].forEach((ch,i)=>{

    keyMap[ch]={f,x,y,w:42,h:42,id};
    keys+=`<rect class="kr z-${f[1]}" x="${x}" y="${y}" width="42" height="42" rx="8"/>`;
    labs+=`<text class="z-${f[1]}" id="${id}" x="${x+21}" y="${y+27}">${ch.toUpperCase()}</text>`;
    if(ri===1&&(i===3||i===6)) keys+=`<rect class="bump" x="${x+14}" y="${y+34}" width="14" height="2.5" rx="1"/>`;
  }));
  keyMap[" "]={f:"Rt",x:122,y:146,w:260,h:38,id:"tsp"};
  keys+=`<rect class="kr z-t" x="122" y="146" width="260" height="38" rx="8"/>`;

function guide(){
  hl.forEach(e=>e.classList.remove("on")); hl=[];
  const lab=$("klab"), c=target[inp.value.length], hk=$("hk"), cn=$("conn");
  const m=c!==undefined && keyMap[c];
  if(!m){ lab.textContent=""; hk.setAttribute("visibility","hidden"); cn.setAttribute("visibility","hidden"); return; }
  const cx=m.x+m.w/2, cy=m.y+m.h/2;
  hk.setAttribute("x",m.x); hk.setAttribute("y",m.y); hk.setAttribute("width",m.w); hk.setAttribute("height",m.h); hk.setAttribute("visibility","visible");
  const f=$("f"+m.f), t=$(m.id);
  if(f){ f.classList.add("on"); hl.push(f); }
  t.classList.add("on"); hl.push(t);
  if(FX[m.f]!==undefined){
    const sx=FX[m.f], sy=TIPY[m.f[1]]+6;
    if(Math.abs(cx-sx)+Math.abs(cy-sy)>26){ cn.setAttribute("d",`M${sx} ${sy} L${cx} ${cy+8}`); cn.setAttribute("visibility","visible"); }
    else cn.setAttribute("visibility","hidden");
  } else cn.setAttribute("visibility","hidden");
  lab.textContent=FN[m.f]+" · "+(c===" "?"bo‘sh joy":c.toUpperCase());
}

function render(){

    let cls="c";
    if(i<v.length) cls+= norm(v[i])===target[i] ? " ok" : " bad";
    else if(i===v.length) cls+=" cur";
    if(els[i].className!==cls) els[i].className=cls;
  }
  const cur=els[Math.min(v.length,els.length-1)];
  const lh=parseFloat(getComputedStyle(words).lineHeight)||0;
  inner.style.transform="translateY(-"+Math.max(0,cur.parentElement.offsetTop-lh)+"px)";
  guide();
}

function correctCount(){
  const v=inp.value; let c=0;
  for(let i=0;i<v.length;i++) if(norm(v[i])===target[i]) c++;
  return c;
}
function sample(el){
  const s=Math.floor(el);
  while(lastSec<s){ lastSec++; samples.push((total-lastTotal)*12); lastTotal=total; }
}
function tick(){
  const el=(performance.now()-t0)/1000;
  if(mode==="t"){
    if(el>=n){ sample(n); setRing(100); finish(n); return; }
    $("v1").textContent=Math.ceil(n-el);
    setRing(el/n*100);
  }
  sample(el);
  $("lwpm").textContent=Math.round(correctCount()/5/Math.max(el/60,1/600));
  $("lacc").textContent=total?Math.round(good/total*100)+"%":"—";
}
function consistency(){
  if(samples.length<3) return null;
  const m=samples.reduce((a,b)=>a+b,0)/samples.length;
  if(!m) return 0;
  const sd=Math.sqrt(samples.reduce((a,b)=>a+(b-m)**2,0)/samples.length);
  return Math.max(0,Math.round(100-sd/m*100));
}

function drawChart(){
  const c=$("chart"), s=samples, ok=s.length>=2;
  c.style.display=ok?"":"none"; $("ccap").style.display=ok?"":"none";
  if(!ok) return;
  const max=Math.max(20,Math.ceil(Math.max(...s)/10)*10), W=550, H=100, X0=40, Y0=10;
  const pts=s.map((v,i)=>[X0+i/(s.length-1)*W, Y0+H-v/max*H]);
  let h=`<line class="ax" x1="${X0}" y1="${Y0+H}" x2="${X0+W}" y2="${Y0+H}"/><line class="ax" x1="${X0}" y1="${Y0}" x2="${X0+W}" y2="${Y0}"/>`;
  h+=`<text x="0" y="${Y0+4}">${max}</text><text x="0" y="${Y0+H+4}">0</text>`;
  h+=`<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--turq);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--turq);stop-opacity:0"/></linearGradient></defs>`+
     `<polygon fill="url(#cg)" points="${X0},${Y0+H} ${pts.map(p=>p.join(",")).join(" ")} ${X0+W},${Y0+H}"/>`;
  h+=`<polyline class="ln" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  pts.forEach(p=>{ h+=`<circle cx="${p[0]}" cy="${p[1]}" r="3"/>`; });
  h+=`<text x="${X0}" y="${Y0+H+24}">1 s</text><text x="${X0+W}" y="${Y0+H+24}" text-anchor="end">${s.length} s</text>`;
  c.innerHTML=h;
}

function countUp(el,to){
  if(!to || matchMedia("(prefers-reduced-motion:reduce)").matches){ el.textContent=to; return; }
  const s=performance.now(), d=800;
  (function f(t){
    const p=Math.min(1,(t-s)/d);
    el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
    if(p<1) requestAnimationFrame(f);
  })(s);
}

function finish(elapsed){
  clearInterval(timer); done=true; inp.blur();
  const mins=elapsed/60, ok=correctCount();
  const wpm=Math.round(ok/5/mins), raw=Math.round(total/5/mins);
  const acc=total?Math.round(good/total*100):0, cons=consistency();
  countUp($("rwpm"),wpm); $("rraw").textContent=raw; $("racc").textContent=acc+"%";
  $("rcons").textContent=cons===null?"—":cons+"%";
  $("rerr").textContent=total-good;
  $("rdur").textContent=(mode==="t"?n:elapsed.toFixed(1))+" s";
  $("rlevel").textContent=LEVELS.find(l=>wpm<l[0])[1];
  drawChart();
  lastShare=`Men "Tez yozish"da ${wpm} so‘z/daq tezlikda yozdim (aniqlik ${acc}%)! ${location.href}`;

  const top=Object.entries(errs).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $("weak").innerHTML = top.length
    ? "Eng ko‘p xato qilingan belgilar: "+top.map(([c,k])=>`<span class="chip"><b>${c===" "?"bo‘sh joy":show(c)}</b>${k}</span>`).join("")
    : "Xatosiz yozdingiz. Barakalla!";

  let adv;
  if(acc<90) adv="Aniqlik past. Tezlikni biroz pasaytirib, xatosiz yozishga harakat qiling: tezlik aniqlikdan keyin keladi.";
  else if(cons!==null && cons<65) adv="Tezligingiz notekis. To‘xtamasdan, bir me’yorda yozib ko‘ring.";
  else if(wpm<30) adv="Barmoqlarni klaviaturadagi ko‘rsatma bo‘yicha joylashtirib mashq qiling. Darslar bo‘limi shunga yordam beradi.";
  else adv="Zo‘r natija! Endi rekordingizni yangilashga harakat qiling.";
  $("radv").textContent=adv;

  const b=$("rbest"), nx=$("next"); nx.hidden=true;
  if(mode==="x"){
    const passed=acc>=90, pr=lp();
    if(passed){ const pv=pr[li]; if(!pv||wpm>pv.wpm) pr[li]={acc,wpm}; saveLp(pr); }
    b.textContent=passed?"Dars o‘tildi!":"Darsni o‘tish uchun aniqlik kamida 90% bo‘lishi kerak. Yana urinib ko‘ring.";
    b.className="best"+(passed?" new":"");
    nx.hidden=!(passed && li<LS.length-1);
  }else{
    const key="tezyozish-best-"+lang+"-"+mode+n; let best=0;
    try{ best=parseInt(localStorage.getItem(key)||"0",10)||0; }catch(e){}
    if(wpm>best && wpm>0){
      b.textContent="Yangi rekord!"; b.className="best new";
      try{ localStorage.setItem(key,String(wpm)); }catch(e){}
    }else{
      b.textContent="Eng yaxshi natija: "+best+" so‘z/daq"; b.className="best";
    }
  }
  stage.style.display="none"; $("foot").style.display="none"; $("kb").style.display="none"; $("lessons").hidden=true;
  result.classList.add("show"); (nx.hidden?$("again"):nx).focus();
}

function reset(){
  clearInterval(timer);
  started=false; done=false; total=0; good=0; prevLen=0; inp.value="";
  errs={}; samples=[]; lastSec=0; lastTotal=0;
  $("v1").textContent = mode==="t" ? n : "0/"+n;
  $("lab1").textContent = mode==="t" ? "soniya" : "so‘z";
  $("ring").classList.toggle("wm",mode!=="t");
  $("lwpm").textContent="0"; $("lacc").textContent="—"; setRing(0);
  document.querySelector(".hint").textContent=UI[lang].hint;
  $("fhint").innerHTML="<kbd>Tab</kbd> — qayta boshlash."+UI[lang].apos;
  result.classList.remove("show"); stage.style.display=""; $("foot").style.display=""; $("kb").style.display="";
  $("kb").classList.toggle("off",!(kbOn||mode==="x"));
  $("kbtog").setAttribute("aria-pressed",String(kbOn));
  $("tm").hidden=tab==="learn"; $("lessons").hidden=tab!=="learn";
  if(mode==="x") buildLessons();
  gen(); buildKb(); guide(); inp.focus();
}

inp.addEventListener("input",()=>{
  if(done) return;
  let v=inp.value;
  if(v.length>target.length){ v=inp.value=v.slice(0,target.length); }
  if(!started){ started=true; t0=performance.now(); timer=setInterval(tick,100); }
  if(v.length>prevLen){
    total++;
    if(norm(v[v.length-1])===target[v.length-1]) good++;
    else { const e=target[v.length-1]; errs[e]=(errs[e]||0)+1; }
  }
  prevLen=v.length;
  render();
  if(mode!=="t"){
    const wd=(target.slice(0,v.length).match(/ /g)||[]).length;
    $("v1").textContent=wd+"/"+n; setRing(wd/n*100);
    if(v.length>=target.length-1) finish((performance.now()-t0)/1000);
  }
});
inp.addEventListener("paste",e=>e.preventDefault());
inp.addEventListener("keydown",e=>{ if(/^(Arrow|Home|End)/.test(e.key)) e.preventDefault(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Tab" || (done && e.key==="Enter")){ e.preventDefault(); reset(); }
});
$("again").addEventListener("click",reset);
$("next").addEventListener("click",()=>{ if(li<LS.length-1) li++; reset(); });
$("share").addEventListener("click",async()=>{
  const b=$("share"); let ok=false;
  try{ await navigator.clipboard.writeText(lastShare); ok=true; }catch(e){}
  b.textContent=ok?"Nusxalandi":"Nusxalab bo‘lmadi";
  setTimeout(()=>{ b.textContent="Natijani nusxalash"; },1600);
});
$("kbtog").addEventListener("click",()=>{
  kbOn=!kbOn;
  try{ localStorage.setItem("tezyozish-kb",kbOn?"1":"0"); }catch(e){}
  $("kb").classList.toggle("off",!(kbOn||mode==="x"));
  $("kbtog").setAttribute("aria-pressed",String(kbOn));
  inp.focus();
});

/* ---------- bo‘limlar, til, rejim, mavzu ---------- */
const mbs=document.querySelectorAll(".mb"), tbs=document.querySelectorAll("#tabs button"), lbs=document.querySelectorAll("#langs button");
function markModes(){ mbs.forEach(b=>b.setAttribute("aria-pressed",String(tab==="test" && b.dataset.m===mode && +b.dataset.n===n))); }
function markTabs(){ tbs.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===tab))); }
function markLangs(){ lbs.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang))); document.documentElement.lang=lang; }

mbs.forEach(b=>b.addEventListener("click",()=>{ mode=b.dataset.m; n=+b.dataset.n; markModes(); reset(); }));
tbs.forEach(b=>b.addEventListener("click",()=>{
  const t=b.dataset.t; if(t===tab) return;
  tab=t;
  if(t==="learn"){ last={mode,n}; mode="x"; n=30; li=firstOpen(); }
  else { mode=last.mode; n=last.n; }
  markTabs(); markModes(); reset();
}));
lbs.forEach(b=>b.addEventListener("click",()=>{
  lang=b.dataset.l; markLangs();
  try{ localStorage.setItem("tezyozish-lang",lang); }catch(e){}
  if(tab==="learn") li=firstOpen();
  reset();
}));

const TC={light:"#eef3fa",dark:"#070e22"};
function setTheme(t,save){
  document.documentElement.dataset.theme=t; $("tc").content=TC[t];
  if(save){ try{ localStorage.setItem("tezyozish-theme",t); }catch(e){} }
}
setTheme(document.documentElement.dataset.theme,false);
$("theme").addEventListener("click",()=>{
  setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark",true);
  if(!done) inp.focus();
});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",e=>{
  let saved=null; try{ saved=localStorage.getItem("tezyozish-theme"); }catch(x){}
  if(!saved) setTheme(e.matches?"dark":"light",false);
});

markModes(); markTabs(); markLangs(); reset();
</script>
</body>
</html>
